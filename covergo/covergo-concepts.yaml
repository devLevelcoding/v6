  # ============================================================ P3
  - name: "P3 — panic/recover discipline"
    description: "recover exists only in HTTP middleware. Guard the goroutines whose panic currently kills a pool or a connection loop silently."
    start_date: "2027-06-08"
    end_date: "2027-06-21"
    tasks:
      - title: "P3: definition of done — panic/recover"
        short_description: "Acceptance bar."
        description: "Every long-lived goroutine (pool worker, per-conn reader/writer, scheduler tick) has a top-level recover that logs with stack + a metric and restarts or cleanly exits — never takes the process down. Tested by injecting a panic."
        priority: low
        estimated_hours: 1
      - title: "P3: GoRender — recover in each pool worker"
        short_description: "A panic in one render must not kill the pool."
        description: "Wrap the worker loop body; on panic, fail that job, log, keep the worker alive."
        priority: low
        estimated_hours: 3
      - title: "P3: GoStream — recover in per-connection read/write goroutines"
        short_description: "One bad frame handler must not crash the server."
        description: "Recover in the conn reader/writer; on panic, evict that connection, log, continue."
        priority: low
        estimated_hours: 3

