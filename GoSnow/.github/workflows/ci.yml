name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - name: race
        run: go test -race -count=1 ./...
      # CGO-free today; CoverGo U10 (embed DuckDB) will add a CGO_ENABLED=1 matrix leg.
      - name: static binary (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /dev/null ./cmd/gosnowd
      - name: bench smoke
        run: go test -run '^$' -bench . -benchtime 1x ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: fuzz statement parser
        run: go test -run '^$' -fuzz 'FuzzExecute$' -fuzztime 40s ./internal/query
